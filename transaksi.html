<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaksi • THELEP FINANCE</title><link rel="stylesheet" href="assets/css/app.css"></head><body data-page="transaksi"><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand">THELEP <span>FINANCE</span></div><div class="tag">Smart Finance Dashboard</div><nav class="nav"><a href="dashboard-unified.html">Dashboard</a><a href="transaksi.html">Transaksi</a><a href="saldo-akun.html">Saldo Akun</a><a href="kas-bank.html">Kas & Bank</a><a href="hutang.html">Hutang</a><a href="piutang.html">Piutang</a><a href="jurnal.html">Jurnal</a><a href="akun.html">Akun</a><a href="entitas.html">Entitas</a><a href="kategori.html">Kategori</a><a href="metode-pembayaran.html">Metode Pembayaran</a><a href="pengaturan.html">Pengaturan</a></nav></aside><main class="main"><header class="topbar"><button class="btn secondary menu-btn" id="menuBtn">☰</button><h1>Transaksi</h1><div class="actions"><button class="btn" id="addBtn">+ Tambah Transaksi</button><button class="btn secondary" id="refreshBtn">Refresh Data</button></div></header><section class="content"><form class="card filters" id="filterForm"><div class="field"><label>Cari</label><input class="input" name="q" placeholder="Cari transaksi"></div><div class="field"><label>Dari</label><input class="input" type="date" name="dari"></div><div class="field"><label>Sampai</label><input class="input" type="date" name="sampai"></div><div class="field"><label>Entitas</label><select name="idEntitas" id="filterEntitas"></select></div><div class="field"><label>Tipe</label><select name="tipeTransaksi" id="filterTipe"></select></div><div class="field"><label>Kategori</label><select name="idKategori" id="filterKategori"></select></div><button class="btn" type="submit">Terapkan</button><button class="btn secondary" type="button" id="resetFilter">Reset</button></form><div id="transactionRoot"></div></section></main></div><div class="modal-backdrop" id="txModal"><div class="modal"><header><h2 id="modalTitle">Tambah Transaksi</h2><button class="btn secondary" id="closeModal">Tutup</button></header><form id="transactionForm"><div class="form-grid"><div class="field"><label>ID Transaksi</label><input class="input" id="idReadonly" readonly></div><div class="field"><label>No Transaksi</label><input class="input" id="noReadonly" readonly></div><div class="field"><label>Tanggal</label><input class="input" type="date" name="tanggal" id="tanggal" required></div><div class="field"><label>Entitas</label><select name="idEntitas" id="idEntitas" required></select></div><div class="field"><label>Tipe Transaksi</label><select name="tipeTransaksi" id="tipeTransaksi" required></select></div><div class="field"><label>Kategori</label><select name="idKategori" id="idKategori"></select></div><div class="field"><label>Akun Debit / Tujuan</label><select name="akunDebit" id="akunDebit"></select></div><div class="field"><label>Akun Kredit / Sumber</label><select name="akunKredit" id="akunKredit"></select></div><div class="field"><label>Nominal</label><input class="input" name="nominal" id="nominal" placeholder="Rp 500.000" required></div><div class="field"><label>Metode Pembayaran</label><select name="idMetode" id="idMetode"></select></div><div class="field"><label>Status</label><select name="status" id="status"><option>Selesai</option><option>Draft</option><option>Batal</option></select></div><div class="field"><label>Pihak</label><input class="input" name="pihak"></div><div class="field span-2"><label>Keterangan</label><textarea name="keterangan"></textarea></div><div class="field span-2"><label>Catatan</label><textarea name="catatan"></textarea></div></div><div class="actions" style="margin-top:16px"><button class="btn" id="saveBtn" type="submit">Simpan</button><button class="btn secondary" type="button" onclick="document.getElementById('txModal').classList.remove('open')">Batal</button></div></form></div></div><div class="toast-stack" id="toast"></div><script type="module" src="assets/js/app.js"></script></body></html>
